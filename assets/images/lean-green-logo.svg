<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(6, 5)">
    <!-- Rounded squircle background -->
    <rect x="0" y="0" width="58" height="58" rx="16" fill="url(#primaryGrad)" />
    
    <!-- Dumbbell barbell bar -->
    <rect x="14" y="27" width="30" height="4" rx="2" fill="#FFFFFF" />
    <!-- Dumbbell weight plates left -->
    <rect x="11" y="20" width="4" height="18" rx="2" fill="#FFFFFF" />
    <rect x="7" y="24" width="3" height="10" rx="1.5" fill="#E2E8F0" opacity="0.9" />
    <!-- Dumbbell weight plates right -->
    <rect x="43" y="20" width="4" height="18" rx="2" fill="#FFFFFF" />
    <rect x="48" y="24" width="3" height="10" rx="1.5" fill="#E2E8F0" opacity="0.9" />

    <!-- Stylized Green Leaf Arching Over -->
    <path d="M29 16 C37 14, 46 22, 44 31 C36 33, 27 25, 29 16 Z" fill="#F0FDF4" />
    <path d="M29 16 C33 22, 38 26, 44 31" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(74, 38)">
    <text font-family="'Montserrat', 'Outfit', 'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="24" letter-spacing="0.5" fill="#0F172A">
      LEAN<tspan fill="#10B981">'N'</tspan>GREEN
    </text>
  </g>
  <g transform="translate(76, 54)">
    <text font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="9" letter-spacing="3.2" fill="#64748B">
      FITNESS &amp; NUTRITION
    </text>
  </g>
</svg>
